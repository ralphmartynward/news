<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Carte des événements — La Ville Rose</title>
<meta name="description" content="Carte des événements à Toulouse jour par jour : concerts, festivals, expositions, marchés. Choisissez une date pour voir ce qui se passe où."/>
<meta property="og:title" content="Carte des événements — La Ville Rose"/>
<meta property="og:description" content="Choisissez une date, voyez les événements à Toulouse sur la carte."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://news.lavillerose.com/map.html"/>
<link rel="canonical" href="https://news.lavillerose.com/map.html"/>
<link rel="icon" type="image/x-icon" href="https://lavillerose.com/assets/favicon/favicon.ico"/>
<link href="/shared.css" rel="stylesheet"/>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
html, body { height: 100%; margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }

.map-hero {
  background: #0f172a; color: #fff;
  padding: 28px 24px 20px; text-align: center;
}
.map-hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px; padding: 5px 14px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.7px;
  text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 14px;
}
.map-hero-title {
  font-size: clamp(20px, 3.2vw, 30px); font-weight: 950; line-height: 1.1;
  letter-spacing: -0.3px; color: #fff; margin: 0 0 14px;
}
.map-hero-title .green { color: #4ade80; }

.map-nav {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px;
}
.map-nav a {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8); border-radius: 999px; padding: 6px 14px;
  font-size: 12px; font-weight: 700; text-decoration: none;
  transition: background 140ms;
}
.map-nav a:hover { background: rgba(255,255,255,0.18); }
.map-nav a.active { background: #4ade80; color: #0f172a; border-color: #4ade80; }

.date-bar {
  display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
}
.date-bar button {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; border-radius: 8px; width: 32px; height: 32px; font-size: 15px;
  cursor: pointer; transition: background 140ms;
}
.date-bar button:hover { background: rgba(255,255,255,0.18); }
.date-bar input[type=date] {
  background: #fff; border: none; border-radius: 8px; padding: 8px 12px;
  font-size: 14px; font-weight: 700; color: #0f172a; font-family: inherit;
}
.date-bar .today-btn {
  width: auto; padding: 0 12px; font-size: 12px; font-weight: 700;
}
.date-count {
  color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 8px;
}

/* ── Layout: map + side list ── */
.map-layout { flex: 1; display: flex; min-height: 0; }
#map { flex: 1; min-width: 0; }
.event-panel {
  width: 320px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e8f0;
  overflow-y: auto; padding: 12px;
}
@media (max-width: 720px) {
  .map-layout { flex-direction: column; }
  #map { height: 46vh; }
  .event-panel { width: auto; border-left: none; border-top: 1px solid #e2e8f0; max-height: 40vh; }
}

.event-card {
  display: flex; gap: 10px; padding: 10px; border-radius: 10px; margin-bottom: 6px;
  text-decoration: none; color: inherit; transition: background 120ms; cursor: pointer;
}
.event-card:hover, .event-card.hover { background: #f0fdf4; }
.event-card-thumb {
  width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #e2e8f0;
}
.event-card-body { min-width: 0; }
.event-card-name { font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 2px; }
.event-card-venue { font-size: 12px; color: #64748b; line-height: 1.4; }
.event-card-link {
  display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700;
  color: #16a34a; text-decoration: none;
}
.event-card-link:hover { text-decoration: underline; }
.event-empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 40px 16px; }

.map-popup { font-size: 13px; max-width: 220px; }
.map-popup img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; }
.map-popup .p-name { font-weight: 800; color: #0f172a; margin-bottom: 3px; }
.map-popup .p-venue { color: #64748b; font-size: 12px; margin-bottom: 6px; }
.map-popup a { color: #16a34a; font-weight: 700; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>

<div class="map-hero">
  <span class="map-hero-eyebrow">📍 Nouveau</span>
  <h1 class="map-hero-title">Carte des <span class="green">événements</span> du jour</h1>
  <nav class="map-nav">
    <a href="/">← Digest du jour</a>
    <a href="/calendar.html">📅 Calendrier</a>
    <a href="/map.html" class="active">🗺️ Carte</a>
    <a href="/calendar.ics">📥 S'abonner (.ics)</a>
  </nav>
  <div class="date-bar">
    <button id="prev-day" title="Jour précédent">←</button>
    <input type="date" id="date-picker"/>
    <button id="today-btn" class="today-btn">Aujourd'hui</button>
    <button id="next-day" title="Jour suivant">→</button>
  </div>
  <p class="date-count" id="date-count"></p>
</div>

<div class="map-layout">
  <div id="map"></div>
  <div class="event-panel" id="event-panel"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const TOULOUSE_CENTER = [1.444, 43.6045];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png", "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png", "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap contributors",
      },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
  center: TOULOUSE_CENTER,
  zoom: 12,
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

let ALL_EVENTS = [];
let currentEvents = []; // events shown for the currently-selected date; kept
                         // fresh on every updateMap() call so the click
                         // handler (registered once) never reads stale data.
let popup = null;

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}

function esc(s) {
  return (s ?? "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function eventsForDate(iso) {
  return ALL_EVENTS.filter(e => e.start <= iso && (e.end ?? e.start) >= iso);
}

function renderPanel(events) {
  const panel = document.getElementById("event-panel");
  if (!events.length) {
    panel.innerHTML = '<p class="event-empty">Aucun événement recensé ce jour-là.</p>';
    return;
  }
  panel.innerHTML = events.map((e, i) => `
    <div class="event-card" data-idx="${i}">
      ${e.image ? `<img class="event-card-thumb" src="${esc(e.image)}" loading="lazy" onerror="this.style.display='none'"/>` : ""}
      <div class="event-card-body">
        <div class="event-card-name">${esc(e.name)}</div>
        <div class="event-card-venue">${esc(e.venue || "")}</div>
        ${e.url ? `<a class="event-card-link" href="${esc(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Voir l'article →</a>` : ""}
      </div>
    </div>
  `).join("");

  panel.querySelectorAll(".event-card").forEach(card => {
    card.addEventListener("click", () => {
      const e = events[parseInt(card.dataset.idx, 10)];
      if (e.lat && e.lon) {
        map.flyTo({ center: [e.lon, e.lat], zoom: 15 });
        showPopup(e);
      }
    });
  });
}

function showPopup(e) {
  if (popup) popup.remove();
  const html = `
    <div class="map-popup">
      ${e.image ? `<img src="${esc(e.image)}" onerror="this.style.display='none'"/>` : ""}
      <div class="p-name">${esc(e.name)}</div>
      <div class="p-venue">${esc(e.venue || "")}</div>
      ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">Voir les détails →</a>` : ""}
    </div>
  `;
  popup = new maplibregl.Popup({ closeButton: true, maxWidth: "240px" })
    .setLngLat([e.lon, e.lat])
    .setHTML(html)
    .addTo(map);
}

function updateMap(iso) {
  const events = eventsForDate(iso).filter(e => e.lat && e.lon);
  currentEvents = events;
  const countEl = document.getElementById("date-count");
  countEl.textContent = `${events.length} événement${events.length !== 1 ? "s" : ""} — ${fmtDateLabel(iso)}`;

  const geojson = {
    type: "FeatureCollection",
    features: events.map(e => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [e.lon, e.lat] },
      properties: { id: e.id, name: e.name },
    })),
  };

  if (map.getSource("events")) {
    map.getSource("events").setData(geojson);
  } else {
    map.addSource("events", { type: "geojson", data: geojson });
    map.addLayer({
      id: "events-circle", type: "circle", source: "events",
      paint: {
        "circle-radius": 8, "circle-color": "#16a34a",
        "circle-stroke-width": 2, "circle-stroke-color": "#fff",
      },
    });
    // Look the clicked feature up by its stable id in currentEvents (always
    // fresh for whatever date is selected) rather than indexing into the
    // geojson/events captured when this handler was registered -- MapLibre
    // doesn't guarantee the feature object passed to the handler is the same
    // JS reference that was put into the source, so an identity-based index
    // lookup (geojson.features.indexOf(f)) silently fails, and closing over
    // the events array from the first render goes stale after a date change.
    map.on("click", "events-circle", (ev) => {
      const f = ev.features?.[0];
      if (!f) return;
      const e = currentEvents.find(ev2 => ev2.id === f.properties.id);
      if (e) showPopup(e);
    });
    map.on("mouseenter", "events-circle", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "events-circle", () => { map.getCanvas().style.cursor = ""; });
  }

  if (popup) { popup.remove(); popup = null; }
  renderPanel(eventsForDate(iso));

  // Fit bounds to today's events, fall back to Toulouse center if none
  if (events.length) {
    const bounds = new maplibregl.LngLatBounds();
    events.forEach(e => bounds.extend([e.lon, e.lat]));
    map.fitBounds(bounds, { padding: 60, maxZoom: 14, duration: 400 });
  } else {
    map.flyTo({ center: TOULOUSE_CENTER, zoom: 12 });
  }
}

function setDate(iso) {
  document.getElementById("date-picker").value = iso;
  updateMap(iso);
  history.replaceState(null, "", "?date=" + iso);
}

document.getElementById("date-picker").addEventListener("change", (e) => setDate(e.target.value));
document.getElementById("today-btn").addEventListener("click", () => setDate(todayStr()));
document.getElementById("prev-day").addEventListener("click", () => {
  const d = new Date(document.getElementById("date-picker").value + "T00:00:00");
  d.setDate(d.getDate() - 1);
  setDate(d.toISOString().slice(0, 10));
});
document.getElementById("next-day").addEventListener("click", () => {
  const d = new Date(document.getElementById("date-picker").value + "T00:00:00");
  d.setDate(d.getDate() + 1);
  setDate(d.toISOString().slice(0, 10));
});

map.on("load", async () => {
  try {
    const res = await fetch("/events.json");
    ALL_EVENTS = await res.json();
  } catch (err) {
    console.error("Failed to load events.json", err);
    ALL_EVENTS = [];
  }
  const params = new URLSearchParams(location.search);
  const initialDate = params.get("date") || todayStr();
  setDate(initialDate);
});
</script>
</body>
</html>
