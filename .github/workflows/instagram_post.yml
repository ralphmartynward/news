name: Post to Instagram

on:
  schedule:
    # Runs well after the digest (digest.yml targets ~06:30 UTC via an external
    # cron-job.org trigger — see its comment). This gap is the review window:
    # check docs/instagram/<date>/review.html and edit a manifest before this fires.
    # Adjust if the digest's actual completion time drifts.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      carousel_only:
        description: 'Post weekend carousel only (skip daily posts/stories)'
        type: boolean
        default: false
      listicle_only:
        description: 'Post listicle carousel(s) only (skip daily posts/stories/weekend)'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for GitHub Pages deployment
        run: |
          # Poll for any of today's possible manifests — only live once the day's
          # build deploys. Which manifests exist depends on what content the
          # digest produced that day (a story-only day has no manifest.json or
          # weekend_manifest.json at all, and would 404 forever on those alone),
          # so treat ANY of them appearing as proof the deploy landed.
          # Checking index.html is useless (always 200 from the previous build).
          # Max wait: 60s initial + 14×30s = 8 minutes total.
          DATE_SLUG=$(date -u +%Y-%m-%d)
          BASE="https://news.lavillerose.com/instagram/${DATE_SLUG}"
          echo "Waiting for Pages to deploy today's content (${DATE_SLUG})..."
          sleep 60
          for i in $(seq 1 14); do
            FOUND=0
            for f in manifest.json today_events_manifest.json weekend_manifest.json; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$f")
              echo "Attempt $i: $f → HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                FOUND=1
              fi
            done
            if [ "$FOUND" = "1" ]; then
              echo "Today's content is live."
              break
            fi
            sleep 30
          done

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_CAROUSEL_ONLY: ${{ inputs.carousel_only && '1' || '0' }}
          IG_LISTICLE_ONLY: ${{ inputs.listicle_only && '1' || '0' }}
        run: python -m src.instagram_post
