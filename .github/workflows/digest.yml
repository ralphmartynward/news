name: Daily Toulouse Digest

on:
  schedule:
    # 05:00 UTC = 07:00 Paris (CEST, summer) / 06:00 Paris (CET, winter)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts
        run: sudo apt-get install -y fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          WORKER_SUBSCRIBE_URL: ${{ vars.WORKER_SUBSCRIBE_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m src.main

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || git add docs/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "Daily digest run $(date -u +%Y-%m-%d) [skip ci]"
          # Retry with rebase to absorb any concurrent pushes (e.g. human work
          # landing on main while the workflow was running).
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt rejected, rebasing on origin..."
            git pull --rebase origin main || exit 1
          done
          echo "push still failing after 3 attempts" >&2
          exit 1

      - name: Wait for GitHub Pages deployment
        run: |
          # Poll until the digest index page returns 200, up to 10 minutes.
          # Pages typically deploys in 2-5 minutes; 90s was not enough.
          echo "Waiting for GitHub Pages to go live..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://news.lavillerose.com/index.html)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Pages is live."
              break
            fi
            sleep 30
          done

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m src.instagram_post
