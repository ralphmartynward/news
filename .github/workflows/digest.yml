name: Daily Toulouse Digest

on:
  schedule:
    # 05:00 UTC = 07:00 Paris (CEST, summer) / 06:00 Paris (CET, winter)
    # GitHub cron can delay 1-2h at peak times; use cron-job.org to trigger
    # workflow_dispatch at 06:30 UTC for reliable 08:30 delivery.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts
        run: sudo apt-get install -y fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          WORKER_SUBSCRIBE_URL: ${{ vars.WORKER_SUBSCRIBE_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m src.main

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || git add docs/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "Daily digest run $(date -u +%Y-%m-%d) [skip ci]"
          # Retry with rebase to absorb any concurrent pushes (e.g. human work
          # landing on main while the workflow was running).
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt rejected, rebasing on origin..."
            git pull --rebase origin main || exit 1
          done
          echo "push still failing after 3 attempts" >&2
          exit 1

      # Instagram posting no longer happens here — it runs later from
      # instagram_post.yml, giving a review window (see docs/instagram/<date>/review.html)
      # to veto a bad candidate before it goes out. See that workflow for the
      # "wait for Pages deployment" step and the actual posting step.
