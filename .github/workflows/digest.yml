name: Daily Toulouse Digest

on:
  schedule:
    # 05:00 UTC = 07:00 Paris (CEST, summer) / 06:00 Paris (CET, winter)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          WORKER_SUBSCRIBE_URL: ${{ vars.WORKER_SUBSCRIBE_URL }}
        run: python -m src.main

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || git add docs/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Daily digest run $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
